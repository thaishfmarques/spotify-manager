<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — Spotify Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="text-center">
    <h1 class="mb-3"><span class="text-success">&#9658;</span> Spotify Manager</h1>
    <p class="text-muted mb-4">Manage your Spotify playlists: export, edit, and add tracks.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <a href="{{ url_for('auth.login') }}" class="btn btn-success btn-lg">
      Connect with Spotify
    </a>
  </div>
</body>
</html>
